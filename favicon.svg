<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Rent Checker</title>
  <!-- A house inside a score ring (red → amber → green), readable at 16 px. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#3f3f46" stroke-width="6"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ring)" stroke-width="6"
    stroke-linecap="round" stroke-dasharray="110 139" transform="rotate(-90 32 32)"/>
  <path d="M32 20 L44 30 V44 H36 V36 H28 V44 H20 V30 Z" fill="#fafafa"/>
</svg>
